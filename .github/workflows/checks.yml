name: Local application checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git lfs pull --include='HeadStart-Starter-Package/site/dist/assets/*.mp4' --exclude=''
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@10.9.8
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -r services/retrieval/requirements.txt
      - run: python -m services.retrieval.setup
      - run: npm run test:python && npm run catalog:init
      - run: npm run check && npm run format:check && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:media
      - run: npm run test:discovery
        env:
          SCREENSHOT_DIR: test-results/discovery
      - run: npm run test:detail
        env:
          SCREENSHOT_DIR: test-results/detail
      - run: npm run test:brief
        env:
          SCREENSHOT_DIR: test-results/brief
      - run: npm run test:retrieval
        env:
          SCREENSHOT_DIR: test-results/retrieval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
