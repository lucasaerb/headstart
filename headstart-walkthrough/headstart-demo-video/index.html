<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HeadStart — Demo</title>
    <meta name="description" content="HeadStart: browse real games and source projects, then remix them into your own. 74-second demo." />

    <meta property="og:type" content="video.other" />
    <meta property="og:title" content="HeadStart — Demo" />
    <meta property="og:description" content="Not a blank canvas. A head start. Browse real games and source projects, then remix them into your own." />
    <meta property="og:image" content="/poster.jpg" />
    <meta property="og:video" content="/headstart-demo.mp4" />
    <meta property="og:video:type" content="video/mp4" />
    <meta property="og:video:width" content="1920" />
    <meta property="og:video:height" content="1080" />
    <meta name="twitter:card" content="player" />
    <meta name="twitter:title" content="HeadStart — Demo" />
    <meta name="twitter:description" content="Not a blank canvas. A head start." />
    <meta name="twitter:image" content="/poster.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..900&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <style>
      :root {
        --cream: #f6f1e6;
        --navy: #10162b;
        --blue: #3b5bff;
        --terracotta: #e2703a;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        background: var(--navy);
        color: var(--cream);
        font-family: "Space Grotesk", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 48px 20px 64px;
        position: relative;
        overflow-x: hidden;
      }
      body::before {
        content: "";
        position: fixed;
        top: -30%;
        left: 50%;
        width: 1100px;
        height: 1100px;
        max-width: 160vw;
        transform: translateX(-50%);
        border-radius: 50%;
        background: rgba(59, 91, 255, 0.18);
        filter: blur(90px);
        pointer-events: none;
        z-index: 0;
      }
      main { position: relative; z-index: 1; width: 100%; max-width: 1120px; }
      header { text-align: center; margin-bottom: 30px; }
      .mark {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        font-family: "Fraunces", Georgia, serif;
        font-weight: 900;
        font-size: clamp(30px, 5vw, 42px);
        letter-spacing: -0.02em;
      }
      .mark .dot {
        width: 12px; height: 12px; border-radius: 3px;
        background: var(--terracotta); flex: none;
      }
      .tagline {
        margin-top: 12px;
        font-size: clamp(15px, 2.4vw, 19px);
        color: rgba(246, 241, 230, 0.72);
      }
      .player {
        border-radius: 16px;
        overflow: hidden;
        background: #000;
        box-shadow: 0 30px 80px rgba(4, 8, 20, 0.6);
        border: 1px solid rgba(246, 241, 230, 0.12);
      }
      video { display: block; width: 100%; height: auto; }
      .actions {
        margin-top: 26px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 14px 26px;
        border-radius: 100px;
        font-size: 16px;
        font-weight: 700;
        text-decoration: none;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      .btn:hover { transform: translateY(-1px); opacity: 0.92; }
      .btn-primary { background: var(--blue); color: #fff; }
      .btn-ghost {
        background: rgba(246, 241, 230, 0.09);
        color: var(--cream);
        border: 1px solid rgba(246, 241, 230, 0.18);
      }
      .meta {
        margin-top: 26px;
        text-align: center;
        font-size: 14px;
        color: rgba(246, 241, 230, 0.45);
        line-height: 1.7;
      }
      @media (max-width: 640px) {
        body { padding: 30px 14px 46px; }
        .player { border-radius: 12px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="mark"><span class="dot"></span>HeadStart</div>
        <p class="tagline">Not a blank canvas. A head start.</p>
      </header>

      <div class="player">
        <video controls playsinline preload="metadata" poster="poster.jpg">
          <source src="headstart-demo.mp4" type="video/mp4" />
          Your browser doesn't support embedded video.
          <a href="headstart-demo.mp4">Download the demo</a> instead.
        </video>
      </div>

      <div class="actions">
        <a class="btn btn-primary" href="https://headstart-virid.vercel.app" target="_blank" rel="noopener">
          Open HeadStart →
        </a>
        <a class="btn btn-ghost" href="headstart-demo.mp4" download>Download video</a>
      </div>

      <p class="meta">
        74 seconds · browse real games and source projects, then remix them into your own.<br />
        Gameplay shown: Copper Water, San Francisco, Fable Cities, Ecctrl Sandbox, Blackwater.
      </p>
    </main>
  </body>
</html>
