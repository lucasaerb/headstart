<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terrain trail — controlled integration target</title><style>body{margin:0;background:#163337;color:#e9f7ef;font:17px system-ui}main{max-width:980px;margin:36px auto;padding:0 24px}h1{font-size:36px;margin-bottom:8px}p{line-height:1.5}canvas{width:100%;height:480px;display:block;border-radius:16px}#result{white-space:pre-wrap;font-size:12px}button{padding:12px;margin:12px 8px 0 0}@media(max-width:500px){main{margin:18px auto;padding:0 16px}canvas{height:360px}h1{font-size:28px}}</style></head><body><main><h1>Terrain trail</h1><p>An existing world, a new landscape. Arrow right moves the orange explorer.</p><canvas id="world"></canvas><button id="start">Start</button><button id="pause">Pause</button><button id="reset">Reset</button><pre id="result">Starting…</pre></main><script type="module">await import('/harness/monitor.js');const {createGame} = await import('./src/game.js');const game=createGame(document.querySelector('canvas'));window.game=game;for(const key of ['start','pause','reset'])document.getElementById(key).onclick=()=>game[key]();document.getElementById('result').textContent=game.snapshot().capability;await import('/harness/browser-check.js');</script></body></html>
